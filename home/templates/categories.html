{% extends 'base.html' %}

{% block title %}Categories{% endblock %}

{% block content %}
<h2 class="section-title">Categories</h2>

<div class="categories-grid">
    {% for cat in categories %}
        <a href="{% url 'category_blogs' cat.id %}" class="category-card">
            <h3>{{ cat.name }}</h3>
            <p>{{ cat.cat_articles.count }} blog(s)</p>
        </a>
    {% empty %}
        <p class="empty-msg">No categories yet.</p>
    {% endfor %}
</div>
{% endblock %}
